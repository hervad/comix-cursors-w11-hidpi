# ─────────────────────────────────────────────────────────────────────────────
# theme.toml - the ONLY build input of a theme repo. Read by `w11cursor`.
# Fill every TODO, then:  w11cursor build theme.toml && w11cursor validate theme.toml
# ─────────────────────────────────────────────────────────────────────────────
schema = 1

[theme]
slug        = "comix"               # used in zip names: <slug>-<variant>-w11-hidpi-v<version>.zip
name        = "Comix Cursors"
version     = "0.1.1"                   # YOUR port version (tag v<version> to release)
license     = "GPL-3.0-or-later"               # artwork license = upstream license (GPL-3.0-only, GPL-2.0-only, ...)
porter      = "Vadym Herman (hervad)"
description = "Comic-style cursors, 6 colours x slim/regular"

[upstream]                              # provenance - copied into README/CREDITS, also documents the pin
kind    = "git"                         # git | tarball
url     = "https://gitlab.com/limitland/comixcursors"
ref     = "115b7a03dc731865cca214f9881a9afa1249eb09"   # tag 0.10.1 = latest commit (2025-06-15) = store version
path    = "upstream"                    # git submodule (or unpacked tarball) location
authors = ["limitland / ComixCursors maintainers"]
license = "GPL-3.0-or-later (COPYING: 'either version 3 of the License, or (at your option) any later version')"
page    = "https://www.gnome-look.org/p/999996"

[render]
renderer       = "resvg"     # keeps upstream's blurred shadow soft (cairosvg draws blur hard-edged, ADR-12)
design_canvas  = 500       # every SVG: width="500" height="500" (viewBox 0 0 1000 1000); HOTSPOTS use these units
hotspot_mode   = "point"
strip_filtered = false     # KEEP upstream's shadow - ADR-14 exception (maintainer, 2026-10-08): Comix Black/Opaque
                           # Black have a white outline that only reads on light backgrounds against this shadow;
                           # without it the edges looked rough at 32 px even with Windows' pointer shadow ON

[sizes]                    # toolkit defaults; see PORT_STATUS for the .ani sizes

# ---- 48 variants = everything on the gnome-look page (p/999996, 4 archives x 12): 6 colours x
# {Regular, Slim} x {translucent, Opaque} x {right-, left-handed}. GENERATED by tools/variants_from_configs.py
# from upstream ComixCursorsConfigs (CONFIG + INCLUDE, upstream's sed substitutions in upstream's order);
# verified: 720 SVGs byte-identical to upstream's own svg_substitutions. Do not edit by hand - regenerate.
# BEGIN GENERATED VARIANTS
