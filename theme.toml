# ---- Roles. Hotspots: upstream svg/RightHanded/HOTSPOTS (500 units); left-handed variants mirror x (mirror_hotspots).
# Animations (upstream bin/build-cursors): one element rotated per frame about its own rotate(0,cx,cy) centre,
# angle = 360 / frames * (frame - 1); 50 ms per frame = 3 jiffies (store build: delays 50 ms; help 2000 + 500 ms).

[cursors.arrow]
svg = "default.svg"
hotspot = [105, 65]

[cursors.help]           # 2 frames: "?" upright 2 s, turned 180 degrees 0.5 s (as upstream)
svg = "help.svg"
rotate = { id = "flowRoot1441", step_deg = 180 }
frame_count = 2
delay = [120, 30]
hotspot = [105, 65]

[cursors.working]
svg = "progress.svg"
rotate = { id = "path1441", step_deg = 15 }
frame_count = 24
delay = 3
hotspot = [105, 65]

[cursors.busy]
svg = "wait.svg"
rotate = { id = "path1398", step_deg = 10 }
frame_count = 36
delay = 3
hotspot = [250, 180]

[cursors.precision]
svg = "crosshair.svg"
hotspot = [250, 202]

[cursors.text]
svg = "text.svg"
hotspot = [250, 200]

[cursors.handwriting]
svg = "pencil.svg"
hotspot = [140, 310]

[cursors.unavailable]
svg = "not-allowed.svg"
hotspot = [250, 174]

[cursors.vert]
svg = "ns-resize.svg"
hotspot = [250, 214]

[cursors.horz]
svg = "ew-resize.svg"
hotspot = [250, 214]

[cursors.dgn1]           # NW-SE
svg = "nwse-resize.svg"
hotspot = [250, 214]

[cursors.dgn2]           # NE-SW
svg = "nesw-resize.svg"
hotspot = [250, 214]

[cursors.move]
svg = "all-scroll.svg"
hotspot = [190, 90]

[cursors.alternate]
svg = "up-arrow.svg"
hotspot = [250, 60]

[cursors.link]
svg = "pointer.svg"
hotspot = [176, 65]

[cursors.pin]            # no Comix artwork: reuse the hand, like the other themes
same_as = "link"

[cursors.person]
same_as = "link"
